<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام نور ERP - إدارة معرض الأدوات الكهربائية</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="app-body">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-container">
        <div class="logo-text">
          <span class="logo-name">نظام نور</span>
          <span class="logo-subtitle">ERP الكهربائيات</span>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active">لوحة التحكم</a>
      <a href="pages/inventory.html" class="nav-item">إدارة الأصناف</a>
      <a href="pages/sales.html" class="nav-item">فواتير المبيعات</a>
    </nav>
  </aside>
  <main class="main-content">
    <header class="topbar">
       <div class="breadcrumb">نظام نور ERP › لوحة التحكم</div>
    </header>
    <div class="page-content">
       <div class="welcome-banner">
         <h1>مرحباً، محمد 👋</h1>
         <p>إليك ملخص أداء اليوم</p>
       </div>
       <div class="kpi-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
         <div class="kpi-card" style="background: #1e2536; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
           <div class="kpi-label">مبيعات اليوم</div>
           <div class="kpi-value" style="font-size: 1.5rem; font-weight: 700; color: #f59e0b;">128,750 ر.س</div>
         </div>
         <div class="kpi-card" style="background: #1e2536; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
           <div class="kpi-label">مشتريات اليوم</div>
           <div class="kpi-value" style="font-size: 1.5rem; font-weight: 700; color: #ef4444;">84,300 ر.س</div>
         </div>
       </div>
    </div>
  </main>
  <script src="assets/js/main.js"></script>
</body>
                                                           </html>
