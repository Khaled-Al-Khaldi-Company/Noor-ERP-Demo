<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام نور ERP - نقطة البيع</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .pos-container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; height: calc(100vh - 150px); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; overflow-y: auto; padding: 10px; }
        .product-card { background: var(--bg-sidebar); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid var(--border-color); transition: 0.2s; }
        .product-card:hover { border-color: var(--primary-color); transform: scale(1.02); }
        .cart-panel { background: var(--bg-sidebar); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--border-color); }
        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .total-section { border-top: 2px solid var(--primary-color); padding-top: 20px; }
        .btn-checkout { width: 100%; padding: 15px; background: var(--primary-color); color: var(--bg-dark); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body class="app-body">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-text">
                    <span class="logo-name">نظام نور</span>
                    <span class="logo-subtitle">ERP الكهربائيات</span>
                </div>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html" class="nav-item"><i class="fas fa-home"></i> لوحة التحكم</a></li>
            <li><a href="inventory.html" class="nav-item"><i class="fas fa-boxes"></i> إدارة الأصناف</a></li>
            <li><a href="pos.html" class="nav-item active"><i class="fas fa-cash-register"></i> نقطة البيع</a></li>
            <li><a href="sales.html" class="nav-item"><i class="fas fa-file-invoice-dollar"></i> المبيعات</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="header">
            <div class="welcome-msg">
                <h1>نقطة البيع (POS)</h1>
                <p>إصدار فواتير سريعة للعملاء</p>
            </div>
            <div class="search-bar" style="width: 300px;">
                <input type="text" placeholder="بحث عن منتج..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-sidebar); color: white;">
            </div>
        </header>

        <div class="pos-container">
            <div class="products-grid" id="pos-products">
                <!-- Products from db.js -->
            </div>
            <div class="cart-panel">
                <h3>سلة المبيعات</h3>
                <div class="cart-items" id="cart-list">
                    <p style="color: var(--text-muted); text-align: center; margin-top: 50px;">السلة فارغة</p>
                </div>
                <div class="total-section">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>الإجمالي:</span>
                        <span id="cart-total">0 ر.س</span>
                    </div>
                    <button class="btn-checkout">تأكيد الدفع وطباعة</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('pos-products');
            if (window.erpDatabase) {
                erpDatabase.products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'product-card';
                    div.innerHTML = `
                        <div style="font-size: 30px; margin-bottom: 10px;"><i class="fas fa-plug"></i></div>
                        <div style="font-weight: bold; margin-bottom: 5px;">${p.name}</div>
                        <div style="color: var(--primary-color);">${p.price} ر.س</div>
                    `;
                    grid.appendChild(div);
                });
            }
        });
    </script>
</body>
</html>
